[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-starchart-maintainer"
version = "0.2.0"
description = "Maintainer tooling package for comfyui-starchart"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = [
    "scripts/common",
    "scripts/extract",
    "scripts/generate",
    "scripts/verify",
]
ignore_missing_imports = true
warn_unused_configs = true
