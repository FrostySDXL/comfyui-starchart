site_name: ComfyUI Knowledge Base
site_description: Version-pinned, source-extracted, machine-readable developer reference for ComfyUI. Complements docs.comfy.org.
site_author: FrostySDXL

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

nav:
  - Home: index.md
  - Start Here:
      - start-here/author.md
      - start-here/extension-developer.md
      - start-here/service-integration.md
      - start-here/docs-contributor.md
      - start-here/tooling-builder.md
  - Orientation:
      - What's New: whats-new/index.md
      - Glossary: reference/glossary.md
      - Troubleshooting:
          - troubleshooting/index.md
          - troubleshooting/api-integration.md
          - troubleshooting/custom-node-and-extension-boundaries.md
          - troubleshooting/docs-authoring-and-site-build.md
      - Known Limitations: known-limitations/index.md
  - Architecture:
      - architecture/overview.md
  - API Reference:
      - API Section Guide: api/index.md
      - api/endpoints.md
      - api/websocket.md
      - api/prompt-submission.md
      - api/history-queue.md
      - api/client-id.md
  - Hooks:
      - Hooks Section Guide: hooks/index.md
      - hooks/javascript-hooks.md
      - hooks/server-hooks.md
      - hooks/extension-points.md
      - hooks/subgraph-extension-behavior.md
  - Custom Nodes:
      - Custom Nodes Section Guide: custom-nodes/index.md
      - custom-nodes/development-guide.md
      - custom-nodes/node-structure.md
      - custom-nodes/v1-reference.md
      - custom-nodes/registration.md
      - custom-nodes/datatypes.md
      - custom-nodes/best-practices.md
      - custom-nodes/v1-to-v3-migration.md
      - custom-nodes/v1-to-v3-case-study-pipe.md
      - custom-nodes/v1-to-v3-case-study-segs.md
  - Extensions:
      - extensions/patterns.md
      - extensions/profilerx-analysis.md
      - extensions/common-architectures.md
  - Tutorials:
      - Tutorials Section Guide: tutorials/index.md
      - tutorials/building-first-node.md
      - tutorials/adding-background-metrics.md
      - tutorials/extending-server.md
      - "API to Workflow: Prompt Lifecycle": "tutorials/api-to-workflow-prompt-lifecycle.md"
      - "API to Workflow: Execution Events": "tutorials/api-to-workflow-execution-events.md"
  - How-To:
      - How-To Section Guide: how-to/index.md
      - how-to/install-custom-nodes-safely.md
      - how-to/enable-and-use-manager-on-manual-or-portable-installs.md
      - how-to/integrate-with-manager.md
      - how-to/update-comfyui-with-version-awareness.md
      - how-to/publish-a-custom-node-to-registry.md
      - how-to/troubleshoot-custom-node-breakage.md
      - how-to/monitor-execution.md
      - how-to/add-custom-routes.md
      - how-to/consumer-starter-examples.md
  - Decision Trees:
      - decision-trees/api-integration.md
      - decision-trees/custom-node-architecture.md
  - Reference:
      - reference/object-info.md
      - reference/server-py-summary.md
      - reference/source-evidence-policy.md
      - reference/writing-style-guide.md
      - reference/doc-quality-checklist.md
      - reference/community-maintenance-policy.md
      - reference/community-generated-surfaces.md
      - reference/version-pin-status.md
      - reference/version-history.md
      - reference/machine-readable-artifacts.md
      - reference/runtime-ci-operations.md
  - Ecosystem:
      - ecosystem/map.md
  - Deep Dives:
      - deep-dives/workflow-json-schema.md
      - deep-dives/execution-model-inversion.md
      - deep-dives/registry-packaging-and-compatibility.md
      - "ComfyUI-Manager (Community)": "deep-dives/comfyui-manager.md"
      - "ComfyUI-Impact-Pack (Community)": "deep-dives/comfyui-impact-pack.md"

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - attr_list
  - md_in_html
  - tables
