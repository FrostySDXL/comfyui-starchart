name: Setup Repo
description: Shared Python/Node/dependency setup for maintainer workflows

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.11"
  setup-node:
    description: Whether to install Node from .nvmrc
    required: false
    default: "false"
  install-node-deps:
    description: Whether to run npm ci
    required: false
    default: "false"
  install-python-deps:
    description: Whether to install requirements.lock
    required: false
    default: "true"
  install-editable:
    description: Whether to install the repo package in editable mode
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Node.js (from .nvmrc)
      if: inputs.setup-node == 'true'
      uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"
        cache: npm

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements.lock

    - name: Install Node dependencies
      if: inputs.install-node-deps == 'true'
      shell: bash
      run: npm ci

    - name: Install Python dependencies
      if: inputs.install-python-deps == 'true'
      shell: bash
      run: python -m pip install -r requirements.lock

    - name: Install package (editable)
      if: inputs.install-editable == 'true'
      shell: bash
      run: python -m pip install -e .
