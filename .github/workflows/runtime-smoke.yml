name: Runtime Smoke

on:
  workflow_dispatch:
    inputs:
      comfyui_url:
        description: "Base URL of the running ComfyUI instance (e.g., http://127.0.0.1:8188)"
        required: true
        type: string
      skip_prompt:
        description: "Skip POST /prompt check"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up repo
        uses: ./.github/actions/setup-repo
        with:
          setup-node: "false"
          install-node-deps: "false"

      - name: Run runtime smoke checks
        shell: bash
        env:
          COMFYUI_URL: ${{ inputs.comfyui_url }}
          SKIP_PROMPT: ${{ inputs.skip_prompt }}
        run: |
          args=(--url "$COMFYUI_URL")
          if [ "$SKIP_PROMPT" = "true" ]; then
            args+=(--skip-prompt)
          fi
          python scripts/verify/runtime_smoke.py "${args[@]}"
