name: Runtime Smoke

on:
  workflow_dispatch:
    inputs:
      comfyui_url:
        description: "Base URL of the running ComfyUI instance (e.g., http://127.0.0.1:8188)"
        required: true
        type: string
      skip_prompt:
        description: "Skip POST /prompt check"
        required: false
        default: false
        type: boolean

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.lock

      - name: Install package (editable)
        run: python -m pip install -e .

      - name: Run runtime smoke checks
        shell: bash
        env:
          COMFYUI_URL: ${{ inputs.comfyui_url }}
          SKIP_PROMPT: ${{ inputs.skip_prompt }}
        run: |
          args=(--url "$COMFYUI_URL")
          if [ "$SKIP_PROMPT" = "true" ]; then
            args+=(--skip-prompt)
          fi
          python scripts/verify/runtime_smoke.py "${args[@]}"
