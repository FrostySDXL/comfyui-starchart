name: Upstream Watch

"on":
  schedule:
    - cron: "0 10 * * 1"  # Every Monday at 10:00 UTC
  workflow_dispatch:

jobs:
  upstream-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up repo
        uses: ./.github/actions/setup-repo
        with:
          setup-node: "false"
          install-node-deps: "false"

      - name: Check upstream versions
        run: |
          python scripts/check_upstream_versions.py --output-json upstream_summary.json --output-md upstream_summary.md

      - name: Upload summary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upstream-summary
          path: |
            upstream_summary.json
            upstream_summary.md

      - name: Ensure upstream-watch label exists
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create upstream-watch \
            --color "ededed" \
            --description "Upstream version watch tracking" \
            2>/dev/null || true

      - name: Create or update tracking issue (scheduled runs only)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q '"update_available": true' upstream_summary.json; then
            TITLE="Upstream refresh available"
            BODY=$(cat upstream_summary.md)
            # Search for existing open issue by title (label may not exist on first run)
            EXISTING=$(gh issue list --search "${TITLE} in:title" --state open --json number --jq '.[0].number')
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body "$BODY"
              echo "Updated tracking issue #$EXISTING"
            else
              gh issue create --title "$TITLE" --body "$BODY" --label "upstream-watch"
              echo "Created new tracking issue"
            fi
          else
            echo "No updates available"
          fi
