name: Upstream Watch

"on":
  schedule:
    - cron: "0 10 * * 1"  # Every Monday at 10:00 UTC
  workflow_dispatch:

# Default GITHUB_TOKEN is read-only; label create and issue write both
# require explicit issues: write. Without this block the label-ensure
# step silently fails (its stderr is redirected and the command is
# followed by `|| true`) and the next step then errors with
# "could not add label: 'upstream-watch' not found".
permissions:
  contents: read
  issues: write

jobs:
  upstream-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up repo
        uses: ./.github/actions/setup-repo
        with:
          setup-node: "false"
          install-node-deps: "false"

      - name: Check upstream versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_upstream_versions.py --output-json upstream_summary.json --output-md upstream_summary.md

      - name: Upload summary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-summary
          path: |
            upstream_summary.json
            upstream_summary.md

      - name: Ensure upstream-watch label exists
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the label; ignore "already exists" but surface any other failure.
          if ! gh label create upstream-watch \
              --color "ededed" \
              --description "Upstream version watch tracking" 2>label.err; then
            if ! grep -q "already exists" label.err; then
              cat label.err
              exit 1
            fi
          fi
          rm -f label.err

      - name: Create or update tracking issue (scheduled runs only)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q '"update_available": true' upstream_summary.json; then
            TITLE="Upstream refresh available"
            BODY=$(cat upstream_summary.md)
            # Search for existing open issue by title (label may not exist on first run)
            EXISTING=$(gh issue list --search "${TITLE} in:title" --state open --json number --jq '.[0].number')
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body "$BODY"
              echo "Updated tracking issue #$EXISTING"
            else
              gh issue create --title "$TITLE" --body "$BODY" --label "upstream-watch"
              echo "Created new tracking issue"
            fi
          else
            echo "No updates available"
          fi
