name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      core_version:
        description: "ComfyUI core version tag (e.g., v0.20.1)"
        required: false
        type: string
      frontend_version:
        description: "ComfyUI frontend version tag (e.g., v1.44.13)"
        required: false
        type: string

jobs:
  blocking-verification:
    name: Blocking verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Node dependencies
        run: npm ci

      - name: Install dependencies
        run: python -m pip install -r requirements.lock

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run Node-side tests
        run: npm test

      - name: Verify Python style
        run: python scripts/verify/python_style.py

      # Run the blocking verification path on both ubuntu-latest and
      # windows-latest so local and CI expectations stay aligned across the two
      # supported platforms. Keep this order aligned with
      # scripts/verify/run_all.py so maintainers can compare local and CI output
      # step-for-step.

      - name: Verify cross-references
        run: python scripts/verify/cross_references.py

      - name: Verify docs index freshness
        run: python scripts/verify/docs_index_freshness.py

      - name: Validate JSON schemas
        run: python scripts/verify/validate_schema.py

      - name: Verify artifact integrity
        run: python scripts/verify/verify_artifact_integrity.py

      - name: Verify markdown top-level spacing
        run: python scripts/verify/markdown_top_level_spacing.py

      - name: Verify generated community pages are fresh
        run: python scripts/verify/community_generated_freshness.py

      - name: Verify community page coverage
        run: python scripts/verify/community_page_coverage.py

      - name: Verify sidebar navigation coverage
        run: python scripts/verify/sidebar_navigation_coverage.py

      - name: Run Astro check
        run: npm run check

      - name: Build Starlight site
        run: npm run build

      - name: Verify rendered links
        run: python scripts/verify/rendered_links.py

  supplemental-verification:
    name: Supplemental verification (ubuntu-latest)
    needs: blocking-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install dependencies
        run: python -m pip install -r requirements.lock

      - name: Run pipeline smoke wrapper
        run: python scripts/verify/pipeline_smoke.py

      - name: Validate shell example syntax
        run: python scripts/verify/shell_examples_syntax.py

  advisory-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.lock

      # Advisory checks stay non-blocking in push/PR CI to preserve the repo's
      # current blocking boundary. Durable escalation lives in the separate
      # advisory-checks.yml workflow, which reruns these checks as blocking on a
      # scheduled or manually dispatched basis.
      - name: Check for stale content
        # Non-blocking: stale markers are informational and should not fail CI
        run: python scripts/verify/stale_content.py
        continue-on-error: true

      - name: Verify extraction idempotency
        # Non-blocking: byte-level differences (e.g., timestamps) are expected;
        # structural differences need manual review but should not block CI
        run: python scripts/verify/extraction_idempotency.py
        continue-on-error: true

      - name: Verify upstream pins
        # Non-blocking: pin failures indicate upstream changes (force-push, tag
        # moves) that need manual review, not an immediate CI block
        run: python scripts/verify/upstream_pins.py
        continue-on-error: true

      - name: Check community metadata
        # Non-blocking: community metadata rules are still stabilizing
        run: python scripts/verify/community_metadata.py
        continue-on-error: true

      - name: Check community staleness
        # Non-blocking: freshness windows are informational until metadata is fully populated
        run: python scripts/verify/community_staleness.py
        continue-on-error: true

      - name: Check example surface integrity
        # Non-blocking: example-surface structural checks add useful coverage but
        # stay advisory while the example surface and its routing references are
        # still evolving. Promote this only after maintainers judge false
        # positives uncommon enough for the default blocking path.
        run: python scripts/verify/example_surface_integrity.py
        continue-on-error: true

  refresh-snapshots:
    if: github.event_name == 'workflow_dispatch' && (inputs.core_version != '' || inputs.frontend_version != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.lock

      - name: Configure git for clone operations
        run: git config --global user.email "ci@comfyui-kb.invalid" && git config --global user.name "CI Bot"

      - name: Refresh snapshots
        run: |
          ARGS=""
          if [ -n "${{ inputs.core_version }}" ]; then
            ARGS="$ARGS --core-version ${{ inputs.core_version }}"
          fi
          if [ -n "${{ inputs.frontend_version }}" ]; then
            ARGS="$ARGS --frontend-version ${{ inputs.frontend_version }}"
          fi
          python scripts/refresh_snapshots.py $ARGS
