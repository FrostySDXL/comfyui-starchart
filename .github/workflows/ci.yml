name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build MkDocs site
        run: python -m mkdocs build

      - name: Verify cross-references
        run: python scripts/verify/cross_references.py

      - name: Check for stale content
        run: python scripts/verify/stale_content.py || true

      - name: Verify extraction idempotency
        run: python scripts/verify/extraction_idempotency.py || true