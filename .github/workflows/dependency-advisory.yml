name: Dependency Advisory

on:
  schedule:
    - cron: "45 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up repo
        uses: ./.github/actions/setup-repo
        with:
          setup-node: "true"
          install-node-deps: "true"

      - name: Run npm high-severity audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high --json | tee npm-audit.json

      - name: Run pip advisory audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pip_audit -r requirements.lock --format json | tee pip-audit.json

      - name: Summarize advisory results
        if: always()
        shell: bash
        run: |
          {
            echo "## Dependency advisory results"
            echo
            echo "- npm audit command: \`npm audit --audit-level=high --json\`"
            echo "- pip audit command: \`python -m pip_audit -r requirements.lock --format json\`"
            echo
            echo "The npm and pip audit steps use \`continue-on-error\` so both advisory reports are collected independently."
            echo "Inspect the job log for full JSON output when a command fails."
          } >> "$GITHUB_STEP_SUMMARY"
