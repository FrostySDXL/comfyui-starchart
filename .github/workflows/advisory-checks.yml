name: Advisory Checks

on:
  schedule:
    - cron: "30 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisory-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up repo
        uses: ./.github/actions/setup-repo
        with:
          setup-node: "false"
          install-node-deps: "false"

      # Replay advisory scripts here as blocking on a weekly schedule and on
      # manual dispatch. This keeps push/PR CI focused on the normal blocking
      # gate while preserving a durable escalation path for advisory failures.
      - name: Check for stale content
        run: python scripts/verify/stale_content.py

      - name: Verify extraction idempotency
        run: python scripts/verify/extraction_idempotency.py

      - name: Verify upstream pins
        run: python scripts/verify/upstream_pins.py

      - name: Check example surface integrity
        # Keep this blocking only in advisory replay until maintainers decide the
        # example surface is stable enough for push/PR CI promotion.
        run: python scripts/verify/example_surface_integrity.py

      - name: Check evidence metadata freshness
        run: python scripts/verify/evidence_metadata_freshness.py

      - name: Audit docs-index unknown routes
        run: python scripts/verify/docs_index_unknown_routes.py

      - name: Check refresh provenance chain integrity
        run: python scripts/verify/provenance_chain_integrity.py

      - name: Check versioned artifact completeness
        run: python scripts/verify/versioned_artifact_completeness.py

      - name: Check site base consistency
        run: python scripts/verify/site_base_consistency.py

      - name: Check governance lifecycle policy coverage
        run: python scripts/verify/governance_lifecycle.py
