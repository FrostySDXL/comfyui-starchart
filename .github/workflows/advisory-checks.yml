name: Advisory Checks

on:
  schedule:
    - cron: "30 11 * * 1"
  workflow_dispatch:

jobs:
  advisory-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.lock

      # Replay the advisory scripts here as blocking on a weekly schedule and on
      # manual dispatch. This keeps push/PR CI focused on the normal blocking
      # gate while preserving a durable escalation path for advisory failures.
      - name: Check for stale content
        run: python scripts/verify/stale_content.py

      - name: Verify extraction idempotency
        run: python scripts/verify/extraction_idempotency.py

      - name: Verify upstream pins
        run: python scripts/verify/upstream_pins.py

      - name: Check community metadata
        run: python scripts/verify/community_metadata.py

      - name: Check community staleness
        run: python scripts/verify/community_staleness.py

      - name: Check example surface integrity
        # Keep this blocking only in advisory replay until maintainers decide the
        # example surface is stable enough for push/PR CI promotion.
        run: python scripts/verify/example_surface_integrity.py
